    }

    function add4(a, b) {
      return [a[0] + b[0], a[1] + b[1], a[2] + b[2], a[3] + b[3]];
    }

    function subtract4(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2], a[3] - b[3]];
    }

    function scale4(a, scalar) {
      return [a[0] * scalar, a[1] * scalar, a[2] * scalar, a[3] * scalar];
    }

    function projectionDirection4(u, v, projection) {
      return add4(
        add4(scale4(projection.axes[0], u), scale4(projection.axes[1], v)),
        projection.axes[2]
      );
    }

    function projectionDirectionFromCoords(coords, projection) {
      return add4(
        add4(scale4(projection.axes[0], coords[0]), scale4(projection.axes[1], coords[1])),
        scale4(projection.axes[2], coords[2])
      );
    }

    function quotientCoords(q, projection) {
      return [
        dot(q, projection.axes[0]),
        dot(q, projection.axes[1]),
        dot(q, projection.axes[2])
      ];
    }

    function makeProjectionData(basis, equation) {
      const mapped = evalCubicMap(basis, projectionPoint.x, projectionPoint.y, 1);
      const mappedNorm = norm(mapped);
      if (!Number.isFinite(mappedNorm) || mappedNorm < 1e-9) return null;
      const point = mapped.map((value) => value / mappedNorm);
      return {
        point,
        axes: makePerpAxes(point),
        equation,
        gradient: evalCubic4Gradient(equation, point),
        pointValue: evalCubic4(equation, point)
      };
    }

    function branchQuarticValue(u, v, projection) {
      const coeffs = projectionResidualCoefficients(u, v, projection);
      return coeffs.quadratic * coeffs.quadratic - 4 * coeffs.linear * coeffs.cubic;
    }

    function branchQuarticValueForDirection(direction, projection) {
      const coeffs = projectionResidualCoefficientsForDirection(direction, projection);
      return coeffs.quadratic * coeffs.quadratic - 4 * coeffs.linear * coeffs.cubic;
    }

    function projectionResidualCoefficients(u, v, projection) {
      const direction = projectionDirection4(u, v, projection);
      return projectionResidualCoefficientsForDirection(direction, projection);
    }

    function projectionResidualCoefficientsForDirection(direction, projection) {
      const plus = add4(projection.point, direction);
      const minus = subtract4(projection.point, direction);
      const linear = dot(projection.gradient, direction);
      const quadratic = 0.5 * (
        evalCubic4(projection.equation, plus) +
        evalCubic4(projection.equation, minus)
      ) - projection.pointValue;
      const cubic = evalCubic4(projection.equation, direction);
      return { direction, linear, quadratic, cubic };
    }

    function projectionPlanePoint(u, v, layout, lift = 0) {
      return [
        u * layout.scale,
        layout.y + lift,
        v * layout.scale
      ];
    }

    function centralProjectQToFloor(q, projector, transform, layout, lift = 0) {
      const raw = projector(q);
      if (!raw || !raw.every(Number.isFinite)) return null;
      const target = applyTransform(raw, transform);
      const vertex = layout.vertex;
      const denom = target[1] - vertex[1];
      if (!Number.isFinite(denom) || Math.abs(denom) < 1e-8) return null;
      const t = (layout.y + lift - vertex[1]) / denom;
      if (!Number.isFinite(t) || Math.abs(t) > 80) return null;
      return [
        vertex[0] + (target[0] - vertex[0]) * t,
        layout.y + lift,
        vertex[2] + (target[2] - vertex[2]) * t
      ];
    }

    function centralProjectDirectionToFloor(u, v, projection, projector, transform, layout, lift = 0) {
      return centralProjectQToFloor(
        projectionDirection4(u, v, projection),
        projector,
        transform,
        layout,
        lift
      );
    }

    function projectionDirectionFromFloorPoint(point, projection, transform) {
      const raw = displayToRaw(point, transform);
      const q = affineChartPoint(raw);
      return projectionDirectionFromCoords(quotientCoords(q, projection), projection);
    }

    function floorBranchValue(x, z, projection, transform, layout) {
      return branchQuarticValueForDirection(
        projectionDirectionFromFloorPoint([x, layout.y, z], projection, transform),
        projection
      );
    }

    function contourSegments2D(valueAt, domain, steps) {
      const segments = [];
      const step = (2 * domain) / steps;

      function pointOnEdge(a, b) {
        const denom = a.value - b.value;
        const t = Math.abs(denom) < 1e-12 ? 0.5 : clamp(a.value / denom, 0, 1);
        return {
          x: a.x + (b.x - a.x) * t,
          y: a.y + (b.y - a.y) * t
        };
      }

      function pushHit(hits, point) {
        if (!Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
        if (hits.some((hit) => Math.hypot(hit.x - point.x, hit.y - point.y) < 1e-5)) return;
        hits.push(point);
      }

      for (let row = 0; row < steps; row += 1) {
        const y0 = -domain + row * step;
        const y1 = y0 + step;
        for (let col = 0; col < steps; col += 1) {
          const x0 = -domain + col * step;
          const x1 = x0 + step;
          const corners = [
            { x: x0, y: y0, value: valueAt(x0, y0) },
            { x: x1, y: y0, value: valueAt(x1, y0) },
            { x: x1, y: y1, value: valueAt(x1, y1) },
            { x: x0, y: y1, value: valueAt(x0, y1) }
          ];
          if (corners.some((corner) => !Number.isFinite(corner.value))) continue;
          const edges = [
            [corners[0], corners[1]],
            [corners[1], corners[2]],
            [corners[2], corners[3]],
            [corners[3], corners[0]]
          ];
          const hits = [];
          for (const [a, b] of edges) {
            if (Math.abs(a.value) < 1e-10) pushHit(hits, { x: a.x, y: a.y });
            if (a.value === 0 || b.value === 0 || (a.value < 0) !== (b.value < 0)) {
              pushHit(hits, pointOnEdge(a, b));
            }
          }
          if (hits.length >= 2) {
            for (let i = 0; i + 1 < hits.length; i += 2) {
              segments.push([hits[i], hits[i + 1]]);
            }
          }
        }
      }

      return segments;
    }

    function clipPlaneLineToSquare(line, domain) {
      const [a, b, c] = line;
      const length = Math.hypot(a, b);
      if (!Number.isFinite(length) || length < 1e-9) return null;
      const hits = [];

      function addHit(x, y) {
        if (
          !Number.isFinite(x) ||
          !Number.isFinite(y) ||
          x < -domain - 1e-7 ||
          x > domain + 1e-7 ||
          y < -domain - 1e-7 ||
          y > domain + 1e-7
        ) return;
        if (hits.some((hit) => Math.hypot(hit.x - x, hit.y - y) < 1e-5)) return;
        hits.push({ x: clamp(x, -domain, domain), y: clamp(y, -domain, domain) });
      }

      if (Math.abs(b) > 1e-9) {
        addHit(-domain, -(a * -domain + c) / b);
        addHit(domain, -(a * domain + c) / b);
      }
      if (Math.abs(a) > 1e-9) {
        addHit(-(b * -domain + c) / a, -domain);
        addHit(-(b * domain + c) / a, domain);
      }
      if (hits.length < 2) return null;

      let first = hits[0];
      let second = hits[1];
      let best = -1;
      for (let i = 0; i < hits.length - 1; i += 1) {
        for (let j = i + 1; j < hits.length; j += 1) {
          const distance = Math.hypot(hits[i].x - hits[j].x, hits[i].y - hits[j].y);
          if (distance > best) {
            best = distance;
            first = hits[i];
            second = hits[j];
          }
        }
      }

      return [first, second];
    }

    function makePlaneStripGeometry(segments, layout, width, lift) {
      const positions = [];
      const indices = [];

      for (const [a, b] of segments) {
        const ax = a.x * layout.scale;
        const az = a.y * layout.scale;
        const bx = b.x * layout.scale;
        const bz = b.y * layout.scale;
        const dx = bx - ax;
        const dz = bz - az;
        const length = Math.hypot(dx, dz);
        if (!Number.isFinite(length) || length < 1e-6) continue;
        const px = (-dz / length) * width * 0.5;
        const pz = (dx / length) * width * 0.5;
        const base = positions.length / 3;
        const y = layout.y + lift;
        positions.push(
          ax + px, y, az + pz,
          ax - px, y, az - pz,
          bx - px, y, bz - pz,
          bx + px, y, bz + pz
        );
        indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      return geometry;
    }

    function makeSpaceStripGeometry(segments, width) {
      const positions = [];
      const indices = [];

      for (const [a, b] of segments) {
        const tangent = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
        const length = norm(tangent);
        if (!Number.isFinite(length) || length < 1e-6) continue;
        const unit = tangent.map((value) => value / length);
        let side = cross3(unit, [0, 1, 0]);
        if (norm(side) < 1e-5) side = cross3(unit, [1, 0, 0]);
        side = normalize(side).map((value) => value * width * 0.5);
        const base = positions.length / 3;
        positions.push(
          a[0] + side[0], a[1] + side[1], a[2] + side[2],
          a[0] - side[0], a[1] - side[1], a[2] - side[2],
          b[0] - side[0], b[1] - side[1], b[2] - side[2],
          b[0] + side[0], b[1] + side[1], b[2] + side[2]
        );
        indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      return geometry;
    }

    function inFloorSquare(point, half, margin = 0) {
      return point &&
        Math.abs(point[0]) <= half + margin &&
        Math.abs(point[2]) <= half + margin;
    }

    function clipFloorLineToSquare(a, b, half, y, lift = 0) {
      if (!a || !b) return null;
      const dx = b[0] - a[0];
      const dz = b[2] - a[2];
      if (!Number.isFinite(dx) || !Number.isFinite(dz) || Math.hypot(dx, dz) < 1e-8) return null;
      const line = [
        a[2] - b[2],
        b[0] - a[0],
        a[0] * b[2] - b[0] * a[2]
      ];
      const normal = Math.hypot(line[0], line[1]);
      const segment = clipPlaneLineToSquare(line.map((value) => value / normal), half);
      if (!segment) return null;
      return [
        [segment[0].x, y + lift, segment[0].y],
        [segment[1].x, y + lift, segment[1].y]
      ];
    }

    function oppositeConePoint(vertex, floorPoint, length) {
      const direction = [
        vertex[0] - floorPoint[0],
        vertex[1] - floorPoint[1],
        vertex[2] - floorPoint[2]
      ];
      const directionLength = Math.max(norm(direction), 1e-8);
      return [
        vertex[0] + (direction[0] / directionLength) * length,
        vertex[1] + (direction[1] / directionLength) * length,
        vertex[2] + (direction[2] / directionLength) * length
      ];
    }

    function pointTowardVertex(point, vertex, distance) {
      const direction = [
        vertex[0] - point[0],
        vertex[1] - point[1],
        vertex[2] - point[2]
      ];
      const directionLength = Math.max(norm(direction), 1e-8);
      return [
        point[0] + (direction[0] / directionLength) * distance,
        point[1] + (direction[1] / directionLength) * distance,
        point[2] + (direction[2] / directionLength) * distance
      ];
    }

    function ramificationSurfacePointFromDirection(direction, projection, projector, transform) {
      const coeffs = projectionResidualCoefficientsForDirection(direction, projection);
      if (!Number.isFinite(coeffs.cubic) || Math.abs(coeffs.cubic) < 1e-8) return null;
      const t = -coeffs.quadratic / (2 * coeffs.cubic);
      if (!Number.isFinite(t) || Math.abs(t) > 120) return null;
      const q = add4(projection.point, scale4(coeffs.direction, t));
      const raw = projector(q);
      if (!raw || !raw.every(Number.isFinite)) return null;
      const display = applyTransform(raw, transform);
      const rawVertex = projector(projection.point);
      const vertex = rawVertex ? applyTransform(rawVertex, transform) : display;
      const ray = [
        display[0] - vertex[0],
        display[1] - vertex[1],
        display[2] - vertex[2]
      ];
      const rayLength = Math.max(norm(ray), 1e-8);
      const offset = 0.055;
      return [
        display[0] + (ray[0] / rayLength) * offset,
        display[1] + (ray[1] / rayLength) * offset,
        display[2] + (ray[2] / rayLength) * offset
      ];
    }

    function ramificationSurfacePoint(u, v, projection, projector, transform) {
      return ramificationSurfacePointFromDirection(
        projectionDirection4(u, v, projection),
        projection,
        projector,
        transform
      );
    }

    function ramificationSurfacePointFromFloorPoint(point, projection, projector, transform) {
      return ramificationSurfacePointFromDirection(
        projectionDirectionFromFloorPoint(point, projection, transform),
        projection,
        projector,
        transform
      );
    }

    function markProjectionObject(object) {
      object.userData.kind = "projection";
      object.traverse((child) => {
        child.userData.kind = "projection";
      });
      contentRoot.add(object);
    }

    function longestCurve(curves) {
      let best = null;
      let bestLength = 0;
      for (const curve of curves) {
        let length = 0;
        for (let i = 1; i < curve.length; i += 1) {
          length += distance3(curve[i - 1], curve[i]);
        }
        if (length > bestLength) {
          best = curve;
          bestLength = length;
        }
      }
      return bestLength > 1e-5 ? best : null;
    }

    function pushProjectionSheet(positions, surfaceCurve, floorSegment) {
      if (!surfaceCurve || surfaceCurve.length < 2 || !floorSegment) return;
      const surfaceA = surfaceCurve[0];
      const surfaceB = surfaceCurve[surfaceCurve.length - 1];
      const floorA = floorSegment[0];
      const floorB = floorSegment[1];
      if (distance3(surfaceA, surfaceB) < 1e-5 || distance3(floorA, floorB) < 1e-5) return;
      positions.push(
        surfaceA[0], surfaceA[1], surfaceA[2],
        surfaceB[0], surfaceB[1], surfaceB[2],
        floorB[0], floorB[1], floorB[2],
        surfaceA[0], surfaceA[1], surfaceA[2],
        floorB[0], floorB[1], floorB[2],
        floorA[0], floorA[1], floorA[2]
      );
    }

    function addProjectionObjects(basis, equation, lineSpans, projector, transform) {
      const projection = makeProjectionData(basis, equation);
      if (!projection || projection.axes.length < 3) return;

      const rawProjectionPoint = projector(projection.point);
      if (!rawProjectionPoint) return;
      const displayPoint = applyTransform(rawProjectionPoint, transform);
      const extent = transform.surfaceExtent || 7.05;
      const domain = 4.7;
      const half = Math.min(12.8, extent * 1.56);
      const layout = {
        domain,
        scale: half / domain,
        y: Math.min(-extent - 0.72, displayPoint[1] - 2.2),
        vertex: displayPoint
      };

      const planeGeometry = new THREE.BufferGeometry();
      planeGeometry.setAttribute("position", new THREE.Float32BufferAttribute([
        -half, layout.y, -half,
        half, layout.y, -half,
        half, layout.y, half,
        -half, layout.y, half
      ], 3));
      planeGeometry.setIndex([0, 1, 2, 0, 2, 3]);
      const planeMaterial = new THREE.MeshBasicMaterial({
        color: 0x071126,
        transparent: true,
        opacity: 0.58,
        side: THREE.DoubleSide,
        depthTest: true,
        depthWrite: false
      });
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.renderOrder = 3;
      markProjectionObject(plane);

      const gridSegments = [];
      for (let i = -4; i <= 4; i += 1) {
        const value = (domain * i) / 4;
        gridSegments.push(
          [{ x: value, y: -domain }, { x: value, y: domain }],
          [{ x: -domain, y: value }, { x: domain, y: value }]
        );
      }
      const gridGeometry = makePlaneStripGeometry(gridSegments, layout, 0.026, 0.018);
      const gridMaterial = new THREE.MeshBasicMaterial({
        color: 0x5b6dff,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide,
        depthTest: true,
        depthWrite: false
      });
      const grid = new THREE.Mesh(gridGeometry, gridMaterial);
      grid.renderOrder = 4;
      markProjectionObject(grid);

      if (showLines) {
        const bitangentSegments = [];
        const sheetPositions = [];
        for (const span of lineSpans) {
          const a = centralProjectQToFloor(span.a, projector, transform, layout, 0.05);
          const b = centralProjectQToFloor(span.b, projector, transform, layout, 0.05);
          const segment = clipFloorLineToSquare(a, b, half, layout.y, 0.05);
          if (!segment) continue;
          bitangentSegments.push(segment);

          if (showLineProjectionPlanes) {
            const lineStore = [];
            const lineCurves = [];
            appendLineSegments(lineStore, lineCurves, span, projector, transform);
            pushProjectionSheet(sheetPositions, longestCurve(lineCurves), segment);
          }
        }

        if (sheetPositions.length) {
          const sheetGeometry = new THREE.BufferGeometry();
          sheetGeometry.setAttribute("position", new THREE.Float32BufferAttribute(sheetPositions, 3));
          sheetGeometry.computeVertexNormals();
          const sheetMaterial = new THREE.MeshBasicMaterial({
            color: 0xffe477,
            transparent: true,
            opacity: 0.105,
            side: THREE.DoubleSide,
            depthTest: true,
            depthWrite: false
          });
          const sheets = new THREE.Mesh(sheetGeometry, sheetMaterial);
          sheets.renderOrder = 5;
          sheets.userData.projectionRole = "line-sheets";
          markProjectionObject(sheets);
        }

        if (bitangentSegments.length) {
          const bitangentGeometry = makeSpaceStripGeometry(bitangentSegments, 0.078);
          const bitangentMaterial = new THREE.MeshBasicMaterial({
            color: 0xffda55,
            transparent: true,
            opacity: 0.72,
            side: THREE.DoubleSide,
            depthTest: true,
            depthWrite: false
          });
          const bitangents = new THREE.Mesh(bitangentGeometry, bitangentMaterial);
          bitangents.renderOrder = 6;
          bitangents.userData.projectionRole = "bitangents";
          markProjectionObject(bitangents);
        }
      }

      const quarticSegments = contourSegments2D(
        (x, z) => floorBranchValue(x, z, projection, transform, layout),
        half,
        184
      );
      const surfaceTraceSegments = [];
      const floorQuarticSegments = [];
      const conePositions = [];
      for (const [a, b] of quarticSegments) {
        const baseA = [a.x, layout.y, a.y];
        const baseB = [b.x, layout.y, b.y];
        const floorA = pointTowardVertex(baseA, displayPoint, 0.085);
        const floorB = pointTowardVertex(baseB, displayPoint, 0.085);
        if (distance3(floorA, floorB) > 1.2) continue;
        floorQuarticSegments.push([floorA, floorB]);

        const surfaceA = ramificationSurfacePointFromFloorPoint(baseA, projection, projector, transform);
        const surfaceB = ramificationSurfacePointFromFloorPoint(baseB, projection, projector, transform);
        if (surfaceA && surfaceB && distance3(surfaceA, surfaceB) < 1.15) {
          surfaceTraceSegments.push([surfaceA, surfaceB]);
        }

        const coneA = pointTowardVertex(baseA, displayPoint, 0.105);
        const coneB = pointTowardVertex(baseB, displayPoint, 0.105);
        if (distance3(coneA, coneB) < 1.2) {
          const oppositeLength = Math.max(extent * 2.9, half * 1.45);
          const oppositeA = oppositeConePoint(displayPoint, coneA, oppositeLength);
          const oppositeB = oppositeConePoint(displayPoint, coneB, oppositeLength);
          conePositions.push(
            displayPoint[0], displayPoint[1], displayPoint[2],
            coneA[0], coneA[1], coneA[2],
            coneB[0], coneB[1], coneB[2],
            displayPoint[0], displayPoint[1], displayPoint[2],
            oppositeB[0], oppositeB[1], oppositeB[2],
            oppositeA[0], oppositeA[1], oppositeA[2]
          );
        }
      }
      if (floorQuarticSegments.length) {
        const quarticGeometry = makeSpaceStripGeometry(floorQuarticSegments, 0.12);
        const quarticMaterial = new THREE.MeshBasicMaterial({
          color: 0xff4fde,
          transparent: true,
          opacity: 0.98,
          side: THREE.DoubleSide,
          depthTest: true,
          depthWrite: false
        });
        const quartic = new THREE.Mesh(quarticGeometry, quarticMaterial);
        quartic.renderOrder = 7;
        quartic.userData.projectionRole = "floor-quartic";
        markProjectionObject(quartic);
      }

      if (surfaceTraceSegments.length) {
        const surfaceTraceGlowGeometry = makeSpaceStripGeometry(surfaceTraceSegments, 0.34);
        const surfaceTraceGlowMaterial = new THREE.MeshBasicMaterial({
          color: 0xff3bda,
          transparent: true,
          opacity: 0.22,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          depthTest: true,
          depthWrite: false
        });
        const surfaceTraceGlow = new THREE.Mesh(surfaceTraceGlowGeometry, surfaceTraceGlowMaterial);
        surfaceTraceGlow.renderOrder = 12;
        surfaceTraceGlow.userData.projectionRole = "surface-trace-glow";
        markProjectionObject(surfaceTraceGlow);

        const surfaceTraceGeometry = makeSpaceStripGeometry(surfaceTraceSegments, 0.17);
        const surfaceTraceMaterial = new THREE.MeshBasicMaterial({
          color: 0xffa7f1,
          transparent: true,
          opacity: 0.98,
          side: THREE.DoubleSide,
          depthTest: true,
          depthWrite: false
        });
        const surfaceTrace = new THREE.Mesh(surfaceTraceGeometry, surfaceTraceMaterial);
        surfaceTrace.renderOrder = 13;
        surfaceTrace.userData.projectionRole = "surface-trace";
        markProjectionObject(surfaceTrace);
      }

      if (conePositions.length) {
        const coneGeometry = new THREE.BufferGeometry();
        coneGeometry.setAttribute("position", new THREE.Float32BufferAttribute(conePositions, 3));
        coneGeometry.computeVertexNormals();
        const coneMaterial = new THREE.MeshBasicMaterial({
          color: 0xff4fde,
          transparent: true,
          opacity: 0.14,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          depthTest: true,
          depthWrite: false
        });
        const cone = new THREE.Mesh(coneGeometry, coneMaterial);
        cone.renderOrder = 8;
        cone.userData.projectionRole = "ramification-cone";
        markProjectionObject(cone);
      }

      const PointMaterial = THREE.MeshStandardMaterial || THREE.MeshBasicMaterial;
      const pointMaterial = new PointMaterial({
        color: 0x65f2ff,
        emissive: 0x1ccfff,
        emissiveIntensity: 0.32,
        roughness: 0.22,
        metalness: 0.15,
        depthTest: true,
        depthWrite: false
      });
      const marker = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 12), pointMaterial);
      marker.position.set(displayPoint[0], displayPoint[1], displayPoint[2]);
      marker.renderOrder = 14;
      markProjectionObject(marker);

      const guideGeometry = new THREE.BufferGeometry();
      guideGeometry.setAttribute("position", new THREE.Float32BufferAttribute([
        displayPoint[0], displayPoint[1], displayPoint[2],
        displayPoint[0], layout.y + 0.11, displayPoint[2]
      ], 3));
      const guideMaterial = new THREE.LineBasicMaterial({
        color: 0x65f2ff,
        transparent: true,
        opacity: 0.28,
        depthTest: true,
        depthWrite: false
      });
      const guide = new THREE.LineSegments(guideGeometry, guideMaterial);
      guide.renderOrder = 5;
      markProjectionObject(guide);
    }

    function addReferenceGrid(transform) {
      const extent = transform.surfaceExtent || 7.05;
      const step = extent / 4;
      const gridPositions = [];

      for (let i = -4; i <= 4; i += 1) {
        const value = i * step;
        gridPositions.push(-extent, value, 0, extent, value, 0);
        gridPositions.push(value, -extent, 0, value, extent, 0);
      }

      const gridGeometry = new THREE.BufferGeometry();
      gridGeometry.setAttribute("position", new THREE.Float32BufferAttribute(gridPositions, 3));
      const gridMaterial = new THREE.LineBasicMaterial({
        color: 0x6f80ff,
        transparent: true,
        opacity: 0.18,
        depthTest: true,
        depthWrite: false
      });
      const grid = new THREE.LineSegments(gridGeometry, gridMaterial);
      grid.userData.kind = "reference";
      grid.renderOrder = 1;
      contentRoot.add(grid);

      const axisPositions = [
        -extent, 0, 0, extent, 0, 0,
        0, -extent, 0, 0, extent, 0,
        0, 0, -extent, 0, 0, extent
      ];
      const axisGeometry = new THREE.BufferGeometry();
      axisGeometry.setAttribute("position", new THREE.Float32BufferAttribute(axisPositions, 3));
      const axisMaterial = new THREE.LineBasicMaterial({
        color: 0xffd85f,
        transparent: true,
        opacity: 0.5,
        depthTest: true,
        depthWrite: false
      });
      const axes = new THREE.LineSegments(axisGeometry, axisMaterial);
      axes.userData.kind = "reference";
      axes.renderOrder = 2;
      contentRoot.add(axes);
    }

    function disposeObject(object) {
      object.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material && child.material !== surfaceMaterial) {
          const disposeMaterial = (material) => {
            if (material.map) material.map.dispose();
            material.dispose();
          };
          if (Array.isArray(child.material)) child.material.forEach(disposeMaterial);
          else disposeMaterial(child.material);
        }
      });
    }

    function clearModel() {
      while (contentRoot.children.length) {
        const child = contentRoot.children.pop();
        disposeObject(child);
      }
    }

    function collectGeometryPoints(kind) {
      const points3 = [];

      contentRoot.traverse((child) => {
        if (kind && child.userData.kind !== kind) return;
        if (!kind && (
          child.userData.kind === "reference" ||
          child.userData.kind === "line-label" ||
          child.userData.kind === "projection"
        )) return;
        const position = child.geometry && child.geometry.getAttribute("position");
        if (!position) return;
        for (let i = 0; i < position.count; i += 1) {
          const x = position.getX(i);
          const y = position.getY(i);
          const z = position.getZ(i);
          if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
          points3.push([x, y, z]);
        }
      });

      return points3;
    }

    function centerContent() {
      let points3 = collectGeometryPoints("surface");
      if (points3.length < 64) points3 = collectGeometryPoints(null);
      if (!points3.length) return 4;
      const radiusPoints = collectGeometryPoints(null);

      const trim = viewMode === "affine" ? 0.08 : 0.03;
      const xs = points3.map((p) => p[0]);
      const ys = points3.map((p) => p[1]);
      const zs = points3.map((p) => p[2]);
      const center = [
        0.5 * (percentile(xs, trim) + percentile(xs, 1 - trim)),
        0.5 * (percentile(ys, trim) + percentile(ys, 1 - trim)),
        0.5 * (percentile(zs, trim) + percentile(zs, 1 - trim))
      ];

      const radii = (radiusPoints.length ? radiusPoints : points3)
        .map((p) => Math.hypot(p[0] - center[0], p[1] - center[1], p[2] - center[2]))
        .filter(Number.isFinite);
      const radius = Math.max(percentile(radii, viewMode === "affine" ? 0.985 : 0.98), 1);

      contentRoot.position.set(-center[0], -center[1], -center[2]);
      return Math.max(radius, 1);
    }

    function rebuildModel() {
      rebuildQueued = false;
      clearModel();

      const { basis, rank } = computeCubicBasis();
      const projector = makeProjector(viewMode);
      const lockedAffineView = viewMode === "affine" && affineViewTransform;
      const surfaceBuild = buildSurfaceMesh(basis, projector, lockedAffineView ? affineViewTransform : null);
      if (viewMode === "affine" && !affineViewTransform) {
        affineViewTransform = cloneTransform(surfaceBuild.transform);
      }
      const lineSpans = buildLineSpans(basis);

      if (showSurface) {
        surfaceBuild.mesh.visible = true;
        surfaceBuild.mesh.userData.kind = "surface";
        contentRoot.add(surfaceBuild.mesh);
      } else {
        surfaceBuild.mesh.geometry.dispose();
      }

      if (showReferenceGrid) addReferenceGrid(surfaceBuild.transform);
      if (showLines) addLineObjects(lineSpans, projector, surfaceBuild.transform);
      if (showProjection) {
        addProjectionObjects(
          basis,
          surfaceBuild.equation || computeSurfaceEquation(basis),
          lineSpans,
          projector,
          surfaceBuild.transform
        );
      }
      configureZoomForBounds(centerContent(), {
        preserveDistance: lockedAffineView,
        preserveUserZoom: true
      });
      if (!lockedAffineView && !orbit.userPanned) {
        centerProjectedView(framingTargetNdc());
      }

      const report = analyzeConfiguration(rank, lineSpans.length);
      planeStatus.textContent = report.message;
      planeStatus.classList.toggle("warn", !report.ok);
      surfaceStatus.textContent = showProjection
        ? `${lineSpans.length} lines · projection`
        : `${lineSpans.length} lines`;
      if (rank < 6) surfaceStatus.textContent += " · singular data";
    }

    function scheduleRebuild() {
      if (rebuildQueued) return;
      rebuildQueued = true;
      requestAnimationFrame(rebuildModel);
    }

    function analyzeConfiguration(cubicRank, lineCount) {
      let minDistance = Infinity;
      for (let i = 0; i < points.length; i += 1) {
        for (let j = i + 1; j < points.length; j += 1) {
          minDistance = Math.min(minDistance, Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y));
        }
      }

      let minArea = Infinity;
      for (let i = 0; i < points.length; i += 1) {
        for (let j = i + 1; j < points.length; j += 1) {
          for (let k = j + 1; k < points.length; k += 1) {
            const a = points[i];
            const b = points[j];
            const c = points[k];
            const area = Math.abs((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x));
            minArea = Math.min(minArea, area);
          }
        }
      }

      const conicRank = orthonormalNullspace(points.map((p) => conicTerms(p.x, p.y, 1)), 6, 1).rank;

      if (minDistance < 0.12) return { ok: false, message: "coincident points" };
      if (minArea < 0.045) return { ok: false, message: "three nearly collinear" };
      if (conicRank < 6) return { ok: false, message: "six on a conic" };
      if (cubicRank < 6 || lineCount < 27) return { ok: false, message: "singular configuration" };
      return { ok: true, message: "general position" };
    }

    function resizePlaneCanvas() {
      const rect = planeCanvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      planeCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
      planeCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
      planeMetrics = {
        width: rect.width,
        height: rect.height,
        dpr,
        cx: rect.width / 2,
        cy: rect.height / 2,
        scale: (Math.min(rect.width, rect.height) * 0.78) / (PLANE_RANGE * 2)
      };
      planeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawPlane();
    }

    function planeToScreen(p) {
      return {
        x: planeMetrics.cx + p.x * planeMetrics.scale,
        y: planeMetrics.cy - p.y * planeMetrics.scale
      };
    }

    function screenToPlane(x, y) {
      return {
        x: clamp((x - planeMetrics.cx) / planeMetrics.scale, -PLANE_RANGE, PLANE_RANGE),
        y: clamp((planeMetrics.cy - y) / planeMetrics.scale, -PLANE_RANGE, PLANE_RANGE)
      };
    }

    function conicValue(coeffs, x, y) {
      return coeffs[0] * x * x +
        coeffs[1] * x * y +
        coeffs[2] * x +
        coeffs[3] * y * y +
        coeffs[4] * y +
        coeffs[5];
    }

    function colorWithAlpha(hex, alpha) {
      const value = Number.parseInt(hex.slice(1), 16);
      const r = (value >> 16) & 255;
      const g = (value >> 8) & 255;
      const b = value & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function drawConicContour(coeffs, color) {
      const steps = 86;
      const min = -PLANE_RANGE;
      const max = PLANE_RANGE;
      const step = (max - min) / steps;
      const scale = planeMetrics.scale;

      function pointOnEdge(a, b) {
        const denom = a.value - b.value;
        const t = Math.abs(denom) < 1e-12 ? 0.5 : clamp(a.value / denom, 0, 1);
        return {
          x: a.x + (b.x - a.x) * t,
          y: a.y + (b.y - a.y) * t
        };
      }

      planeCtx.save();
      planeCtx.lineWidth = 2.2;
      planeCtx.strokeStyle = colorWithAlpha(color, 0.82);
      planeCtx.setLineDash([8, 5]);
      planeCtx.shadowColor = colorWithAlpha(color, 0.5);
      planeCtx.shadowBlur = 12;
      planeCtx.beginPath();

      for (let row = 0; row < steps; row += 1) {
        const y0 = min + row * step;
        const y1 = y0 + step;
        for (let col = 0; col < steps; col += 1) {
          const x0 = min + col * step;
          const x1 = x0 + step;
          const corners = [
            { x: x0, y: y0, value: conicValue(coeffs, x0, y0) },
            { x: x1, y: y0, value: conicValue(coeffs, x1, y0) },
            { x: x1, y: y1, value: conicValue(coeffs, x1, y1) },
            { x: x0, y: y1, value: conicValue(coeffs, x0, y1) }
          ];
          const edges = [
            [corners[0], corners[1]],
            [corners[1], corners[2]],
            [corners[2], corners[3]],
            [corners[3], corners[0]]
          ];
          const hits = [];

          for (const [a, b] of edges) {
            if (Math.abs(a.value) < 1e-10) hits.push({ x: a.x, y: a.y });
            if (a.value === 0 || b.value === 0 || (a.value < 0) !== (b.value < 0)) {
              hits.push(pointOnEdge(a, b));
            }
          }

          if (hits.length >= 2) {
            for (let i = 0; i + 1 < hits.length; i += 2) {
              const a = hits[i];
              const b = hits[i + 1];
              planeCtx.moveTo(a.x * scale, -a.y * scale);
              planeCtx.lineTo(b.x * scale, -b.y * scale);
            }
          }
        }
      }

      planeCtx.stroke();
      planeCtx.restore();
    }

    function drawPlaneConics() {
      for (let omit = 0; omit < points.length; omit += 1) {
        const throughFive = points.filter((_, index) => index !== omit);
        const conic = computeConic(throughFive);
        if (conic) drawConicContour(conic, lineColor("conic", omit));
      }
    }

    function drawPlane() {
      const { width, height, cx, cy, scale } = planeMetrics;
      planeCtx.clearRect(0, 0, width, height);
      planeCtx.fillStyle = "#070911";
      planeCtx.fillRect(0, 0, width, height);

      planeCtx.save();
      planeCtx.translate(cx, cy);
      planeCtx.lineWidth = 1;

      for (let value = -PLANE_RANGE; value <= PLANE_RANGE + 1e-6; value += 0.5) {
        const alpha = Math.abs(value) < 1e-6 ? 0.34 : 0.13;
        planeCtx.strokeStyle = `rgba(127, 139, 194, ${alpha})`;
        planeCtx.beginPath();
        planeCtx.moveTo(value * scale, -PLANE_RANGE * scale);
        planeCtx.lineTo(value * scale, PLANE_RANGE * scale);
        planeCtx.stroke();
        planeCtx.beginPath();
        planeCtx.moveTo(-PLANE_RANGE * scale, -value * scale);
        planeCtx.lineTo(PLANE_RANGE * scale, -value * scale);
        planeCtx.stroke();
      }

      planeCtx.lineWidth = 1.2;
      for (let i = 0; i < points.length; i += 1) {
        for (let j = i + 1; j < points.length; j += 1) {
          const a = points[i];
          const b = points[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const length = Math.hypot(dx, dy) || 1;
          const ux = dx / length;
          const uy = dy / length;
          planeCtx.strokeStyle = colorWithAlpha(lineColor("pair", pairLineIndex(i, j)), 0.56);
          planeCtx.beginPath();
          planeCtx.moveTo((a.x - ux * 5) * scale, -(a.y - uy * 5) * scale);
          planeCtx.lineTo((a.x + ux * 5) * scale, -(a.y + uy * 5) * scale);
          planeCtx.stroke();
        }
      }

      drawPlaneConics();

      planeCtx.restore();

      points.forEach((point, index) => {
        const s = planeToScreen(point);
        const active = index === selectedPoint;
        planeCtx.beginPath();
        planeCtx.arc(s.x, s.y, active ? 13 : 10, 0, Math.PI * 2);
        planeCtx.fillStyle = pointColors[index];
        planeCtx.fill();
        planeCtx.lineWidth = active ? 4 : 2.4;
        planeCtx.strokeStyle = active ? "#fff4b2" : "#f0ce45";
        planeCtx.stroke();

        planeCtx.fillStyle = "#fff4b2";
        planeCtx.font = "700 11px Inter, system-ui, sans-serif";
        planeCtx.textAlign = "center";
        planeCtx.textBaseline = "middle";
        planeCtx.fillText(String(index + 1), s.x, s.y + 0.5);
      });

      if (showProjection) {
        const s = planeToScreen(projectionPoint);
        const active = selectedPoint === 6;
        planeCtx.save();
        planeCtx.shadowColor = "rgba(101, 242, 255, 0.5)";
        planeCtx.shadowBlur = active ? 20 : 14;
        planeCtx.beginPath();
        planeCtx.arc(s.x, s.y, active ? 14 : 11, 0, Math.PI * 2);
        planeCtx.fillStyle = "#06151d";
        planeCtx.fill();
        planeCtx.lineWidth = active ? 4 : 2.6;
        planeCtx.strokeStyle = active ? "#d8fcff" : "#65f2ff";
        planeCtx.stroke();
        planeCtx.shadowBlur = 0;
        planeCtx.fillStyle = "#d8fcff";
        planeCtx.font = "800 11px Inter, system-ui, sans-serif";
        planeCtx.textAlign = "center";
        planeCtx.textBaseline = "middle";
        planeCtx.fillText("7", s.x, s.y + 0.5);
        planeCtx.restore();
      }

      updateReadout();
    }

    function updateReadout() {
      const displayedPoints = showProjection ? points.concat([projectionPoint]) : points;
      pointReadout.innerHTML = displayedPoints
        .map((p, index) => `<span><b>P${index + 1}</b> (${p.x.toFixed(2)}, ${p.y.toFixed(2)})</span>`)
        .join("");
    }

    function canvasPointerPosition(event) {
      const rect = planeCanvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    planeCanvas.addEventListener("pointerdown", (event) => {
      const pos = canvasPointerPosition(event);
      let nearest = -1;
      let best = 22;
      points.forEach((point, index) => {
        const s = planeToScreen(point);
        const d = Math.hypot(s.x - pos.x, s.y - pos.y);
        if (d < best) {
          best = d;
          nearest = index;
        }
      });
      if (showProjection) {
        const s = planeToScreen(projectionPoint);
        const d = Math.hypot(s.x - pos.x, s.y - pos.y);
        if (d < best) nearest = 6;
      }
      if (nearest >= 0) {
        selectedPoint = nearest;
        planeCanvas.setPointerCapture(event.pointerId);
        drawPlane();
      }
    });

    planeCanvas.addEventListener("pointermove", (event) => {
      if (selectedPoint < 0) return;
      const pos = canvasPointerPosition(event);
      if (selectedPoint === 6) projectionPoint = screenToPlane(pos.x, pos.y);
      else points[selectedPoint] = screenToPlane(pos.x, pos.y);
      drawPlane();
      scheduleRebuild();
    });

    function releasePlanePointer(event) {
      if (selectedPoint >= 0 && planeCanvas.hasPointerCapture(event.pointerId)) {
        planeCanvas.releasePointerCapture(event.pointerId);
      }
      selectedPoint = -1;
      drawPlane();
      scheduleRebuild();
    }

    planeCanvas.addEventListener("pointerup", releasePlanePointer);
    planeCanvas.addEventListener("pointercancel", releasePlanePointer);

    function resizeRenderer() {
      const rect = surfaceMount.getBoundingClientRect();
      renderer.setSize(Math.max(1, rect.width), Math.max(1, rect.height), false);
      camera.aspect = Math.max(1, rect.width) / Math.max(1, rect.height);
      camera.updateProjectionMatrix();
      configureZoomForBounds(orbit.contentRadius, { preserveUserZoom: true });
      if (!orbit.userPanned) centerProjectedView(framingTargetNdc());
    }

    function setCameraDistance(distance) {
      orbit.distance = clamp(distance, orbit.minDistance, orbit.maxDistance);
      camera.position.z = orbit.distance;
    }

    function fitDistanceForRadius(radius) {
      const verticalFov = (camera.fov * Math.PI) / 180;
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * Math.max(camera.aspect, 0.1));
      const limitingFov = Math.max(0.1, Math.min(verticalFov, horizontalFov));
      const minimumFit = viewMode === "affine"
        ? (camera.aspect < 0.85 ? 54 : 38)
        : 8;
      const maximumFit = viewMode === "affine" ? 110 : 70;
      return clamp(radius / Math.sin(limitingFov / 2) * 1.14, minimumFit, maximumFit);
    }

    function configureZoomForBounds(radius, options = {}) {
      orbit.contentRadius = Math.max(radius || orbit.contentRadius || 4, 1);
      orbit.fitDistance = fitDistanceForRadius(orbit.contentRadius);
      orbit.minDistance = Math.max(3.4, orbit.fitDistance * 0.22);
      orbit.maxDistance = Math.max(80, orbit.fitDistance * 6);
      orbit.panLimit = Math.max(12, orbit.contentRadius * 5, orbit.maxDistance * 0.35);

      if (options.preserveDistance || (options.preserveUserZoom && orbit.userZoomed)) {
        setCameraDistance(orbit.distance);
      } else {
        setCameraDistance(orbit.fitDistance);
      }
    }

    function updateViewPan() {
      modelRoot.position.set(orbit.panX, orbit.panY, 0);
    }

    const projectionScratch = new THREE.Vector3();
    const projectedCenterScratch = new THREE.Vector3();
    const projectedTargetScratch = new THREE.Vector3();

    function framingTargetNdc() {
      return { x: 0, y: 0 };
    }

    function projectedContentBounds() {
      const surfacePoints = [];
      const linePoints = [];

      scene.updateMatrixWorld(true);
      camera.updateMatrixWorld(true);
      contentRoot.traverse((child) => {
        if (
          child.userData.kind === "reference" ||
          child.userData.kind === "line-label" ||
          child.userData.kind === "projection"
        ) return;
        const position = child.geometry && child.geometry.getAttribute("position");
        if (!position) return;
        const points = child.userData.kind === "surface" ? surfacePoints : linePoints;
        for (let i = 0; i < position.count; i += 1) {
          projectionScratch.fromBufferAttribute(position, i);
          child.localToWorld(projectionScratch);
          const depth = camera.position.z - projectionScratch.z;
          projectionScratch.project(camera);
          if (
            !Number.isFinite(projectionScratch.x) ||
            !Number.isFinite(projectionScratch.y) ||
            !Number.isFinite(projectionScratch.z) ||
            projectionScratch.z < -1 ||
            projectionScratch.z > 1
          ) continue;

          points.push({
            x: projectionScratch.x,
            y: projectionScratch.y,
            z: projectionScratch.z,
            depth: Math.max(depth, 0.1)
          });
        }
      });

      const points = surfacePoints.length >= 64 ? surfacePoints : surfacePoints.concat(linePoints);
      if (!points.length) return null;

      const xs = points.map((p) => p.x);
      const ys = points.map((p) => p.y);
      const trim = viewMode === "affine" ? 0.08 : 0.035;
      const bounds = {
        minX: percentile(xs, trim),
        minY: percentile(ys, trim),
        maxX: percentile(xs, 1 - trim),
        maxY: percentile(ys, 1 - trim),
        totalDepth: 0,
        totalZ: 0,
        count: points.length,
        usedSurfaceOnly: surfacePoints.length >= 64
      };

      for (const point of points) {
        bounds.totalDepth += point.depth;
        bounds.totalZ += point.z;
      }

      bounds.centerX = 0.5 * (bounds.minX + bounds.maxX);
      bounds.centerY = 0.5 * (bounds.minY + bounds.maxY);
      bounds.depth = bounds.totalDepth / points.length;
      bounds.z = bounds.totalZ / points.length;
      return bounds;
    }

    function centerProjectedView(target = { x: 0, y: 0 }) {
      updateViewPan();
      for (let step = 0; step < 6; step += 1) {
        const bounds = projectedContentBounds();
        const errorX = bounds ? bounds.centerX - target.x : 0;
        const errorY = bounds ? bounds.centerY - target.y : 0;
        if (!bounds || Math.hypot(errorX, errorY) < 0.002) break;

        const originalX = orbit.panX;
        const originalY = orbit.panY;
        const epsilon = Math.max(0.04, orbit.distance * 0.002);

        orbit.panX = originalX + epsilon;
        orbit.panY = originalY;
        updateViewPan();
        const xProbe = projectedContentBounds();

        orbit.panX = originalX;
        orbit.panY = originalY + epsilon;
        updateViewPan();
        const yProbe = projectedContentBounds();

        orbit.panX = originalX;
        orbit.panY = originalY;

        if (!xProbe || !yProbe) break;

        const dxx = (xProbe.centerX - bounds.centerX) / epsilon;
        const dyx = (xProbe.centerY - bounds.centerY) / epsilon;
        const dxy = (yProbe.centerX - bounds.centerX) / epsilon;
        const dyy = (yProbe.centerY - bounds.centerY) / epsilon;
        const determinant = dxx * dyy - dxy * dyx;
        let deltaX;
        let deltaY;

        if (Math.abs(determinant) > 1e-8) {
          deltaX = (-errorX * dyy + errorY * dxy) / determinant;
          deltaY = (-dxx * errorY + dyx * errorX) / determinant;
        } else {
          projectedCenterScratch.set(bounds.centerX, bounds.centerY, bounds.z).unproject(camera);
          projectedTargetScratch.set(target.x, target.y, bounds.z).unproject(camera);
          deltaX = projectedTargetScratch.x - projectedCenterScratch.x;
          deltaY = projectedTargetScratch.y - projectedCenterScratch.y;
        }

        if (!Number.isFinite(deltaX) || !Number.isFinite(deltaY)) break;
        orbit.panX = clamp(originalX + deltaX, -orbit.panLimit, orbit.panLimit);
        orbit.panY = clamp(originalY + deltaY, -orbit.panLimit, orbit.panLimit);
        updateViewPan();
      }
    }

    function panUnitsPerPixel() {
      const rect = surfaceMount.getBoundingClientRect();
      const visibleHeight = 2 * Math.tan((camera.fov * Math.PI) / 360) * orbit.distance;
      return visibleHeight / Math.max(1, rect.height);
    }

    function setDragMode(mode) {
      orbit.dragMode = mode;
      surfaceMount.classList.toggle("pan-mode", mode === "pan");
      document.querySelectorAll("[data-drag-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.dragMode === mode);
      });
    }

    function centerView() {
      orbit.panX = 0;
      orbit.panY = 0;
      orbit.userZoomed = false;
      orbit.userPanned = false;
      updateViewPan();
      if (viewMode === "affine") {
        affineViewTransform = null;
        scheduleRebuild();
      } else {
        configureZoomForBounds(centerContent());
        setCameraDistance(orbit.fitDistance);
        centerProjectedView(framingTargetNdc());
      }
    }

    surfaceMount.addEventListener("pointerdown", (event) => {
      orbit.dragging = true;
      orbit.activeDrag = event.shiftKey ? "pan" : orbit.dragMode;
      orbit.lastX = event.clientX;
      orbit.lastY = event.clientY;
      surfaceMount.setPointerCapture(event.pointerId);
    });

    surfaceMount.addEventListener("pointermove", (event) => {
      if (!orbit.dragging) return;
      const dx = event.clientX - orbit.lastX;
      const dy = event.clientY - orbit.lastY;
      orbit.lastX = event.clientX;
      orbit.lastY = event.clientY;
      if (orbit.activeDrag === "pan") {
        const units = panUnitsPerPixel();
        orbit.panX = clamp(orbit.panX + dx * units, -orbit.panLimit, orbit.panLimit);
        orbit.panY = clamp(orbit.panY - dy * units, -orbit.panLimit, orbit.panLimit);
        orbit.userPanned = true;
        updateViewPan();
      } else {
        modelRoot.rotation.y += dx * 0.008;
        modelRoot.rotation.x += dy * 0.008;
        modelRoot.rotation.x = clamp(modelRoot.rotation.x, -Math.PI * 0.72, Math.PI * 0.72);
      }
    });

    function releaseSurfacePointer(event) {
      orbit.dragging = false;
      if (surfaceMount.hasPointerCapture(event.pointerId)) surfaceMount.releasePointerCapture(event.pointerId);
    }

    surfaceMount.addEventListener("pointerup", releaseSurfacePointer);
    surfaceMount.addEventListener("pointercancel", releaseSurfacePointer);

    surfaceMount.addEventListener("wheel", (event) => {
      event.preventDefault();
      orbit.userZoomed = true;
      setCameraDistance(orbit.distance * Math.exp(event.deltaY * 0.0012));
      if (!orbit.userPanned) centerProjectedView(framingTargetNdc());
    }, { passive: false });

    document.querySelectorAll("[data-drag-mode]").forEach((button) => {
      button.addEventListener("click", () => setDragMode(button.dataset.dragMode));
    });

    centerViewBtn.addEventListener("click", centerView);

    surfaceToggle.addEventListener("change", () => {
      showSurface = surfaceToggle.checked;
      scheduleRebuild();
    });

    lineToggle.addEventListener("change", () => {
      showLines = lineToggle.checked;
      scheduleRebuild();
    });

    labelToggle.addEventListener("change", () => {
      showLineLabels = labelToggle.checked;
      scheduleRebuild();
    });

    gridToggle.addEventListener("change", () => {
      showReferenceGrid = gridToggle.checked;
      scheduleRebuild();
    });

    projectionToggle.addEventListener("change", () => {
      showProjection = projectionToggle.checked;
      document.body.classList.toggle("projection-on", showProjection);
      drawPlane();
      scheduleRebuild();
    });

    linePlaneToggle.addEventListener("change", () => {
      showLineProjectionPlanes = linePlaneToggle.checked;
      scheduleRebuild();
    });

    resetBtn.addEventListener("click", () => {
      points = clonePoints(defaultPoints);
      projectionPoint = { ...defaultProjectionPoint };
      orbit.userZoomed = false;
      orbit.userPanned = false;
      orbit.panX = 0;
      orbit.panY = 0;
      affineViewTransform = null;
      updateViewPan();
      drawPlane();
      scheduleRebuild();
    });

    shuffleBtn.addEventListener("click", () => {
      points = randomGeneralPoints();
      orbit.userZoomed = false;
      orbit.userPanned = false;
      orbit.panX = 0;
      orbit.panY = 0;
      affineViewTransform = null;
      updateViewPan();
      drawPlane();
      scheduleRebuild();
    });

    function randomGeneralPoints() {
      for (let attempt = 0; attempt < 500; attempt += 1) {
        const candidate = [];
        for (let i = 0; i < 6; i += 1) {
          candidate.push({
            x: -2.0 + Math.random() * 4.0,
            y: -1.8 + Math.random() * 3.6
          });
        }
        const previous = points;
        points = candidate;
        const rank = computeCubicBasis().rank;
        const report = analyzeConfiguration(rank, 27);
        points = previous;
        if (report.ok) return candidate;
      }
      return clonePoints(defaultPoints);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      resizePlaneCanvas();
      resizeRenderer();
    });

    resizePlaneCanvas();
    resizeRenderer();
    rebuildModel();
    animate();
  </script>
</body>
</html>
